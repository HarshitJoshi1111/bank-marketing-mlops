stages:
  download:
    cmd: python -m src.download
    deps:
      - src/download.py
    params:
      - data
    outs:
      - data/raw/bank-additional-full.csv

  prepare:
    cmd: python -m src.prepare
    deps:
      - src/prepare.py
      - data/raw/bank-additional-full.csv
    params:
      - prepare
    outs:
      - data/prepared/bank.csv

  split:
    cmd: python -m src.split
    deps:
      - src/split.py
      - data/prepared/bank.csv
    params:
      - split
    outs:
      - data/split/train.csv
      - data/split/test.csv

  train:
    cmd: python -m src.train
    deps:
      - src/train.py
      - src/features.py
      - src/threshold.py
      - data/split/train.csv
    params:
      - train
    outs:
      - models/model.joblib
      - models/run.json:
          cache: false
    metrics:
      - reports/cv_metrics.json:
          cache: false

  evaluate:
    cmd: python -m src.evaluate
    deps:
      - src/evaluate.py
      - models/model.joblib
      - models/run.json
      - data/split/test.csv
    metrics:
      - reports/metrics.json:
          cache: false
    plots:
      - reports/roc.csv:
          x: fpr
          y: tpr
          cache: false
      - reports/pr.csv:
          x: recall
          y: precision
          cache: false

  register:
    cmd: python -m src.register
    deps:
      - src/register.py
      - models/run.json
      - reports/metrics.json
    params:
      - register
    outs:
      - reports/registry.json:
          cache: false
